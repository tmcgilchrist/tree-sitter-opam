name: CI

on:
  push:
    branches: [main, master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  # Pinned so generated output cannot drift with upstream releases.
  TREE_SITTER_VERSION: v0.27.0
  TS_ABI_VERSION: '14'

jobs:
  test:
    name: Test Parser
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{env.TREE_SITTER_VERSION}}

      - name: Report tree-sitter version
        run: tree-sitter --version
        shell: bash

      - name: Run parser tests
        uses: tree-sitter/parser-test-action@v3
        with:
          abi-version: ${{env.TS_ABI_VERSION}}
          test-rust: ${{runner.os == 'Linux'}}
          test-node: true
          test-python: false
          test-go: true
          test-swift: false
          node-version: '20'

  parse-examples:
    name: Parse Examples
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{env.TREE_SITTER_VERSION}}

      - name: Parse example files
        uses: tree-sitter/parse-action@v4
        with:
          files: |-
            test/example.opam

  check-queries:
    name: Check Queries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{env.TREE_SITTER_VERSION}}

      - name: Test highlight queries
        run: tree-sitter highlight queries/highlights.scm --check

      - name: Test injection queries
        run: tree-sitter highlight queries/injections.scm --check || true

      - name: Test tags queries
        run: ./test/test-tags.sh
