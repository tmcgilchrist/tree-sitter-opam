name: Fuzz Parser

on:
  push:
    branches: [main, master]
    paths:
      - grammar.js
      - src/parser.c
  pull_request:
    paths:
      - grammar.js
      - src/parser.c
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  # Keep in sync with TREE_SITTER_VERSION in ci.yml.
  TREE_SITTER_VERSION: v0.27.0

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fuzz parser
        uses: tree-sitter/fuzz-action@v4
        with:
          tree-sitter-version: ${{env.TREE_SITTER_VERSION}}
          language: opam
